services:
  sharedki_flask_app:
    build:
      context: .
    container_name: sharedki_flask_dev_container
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FLASK_SECRET: ${FLASK_SECRET}
      DATABASE_PATH: /data/cyberquest.db
      SAVEGAMES_PATH: /app/savegames
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      - cyberquest_dev_data:/data
      - ./savegames:/app/savegames
    command: flask run --debug --host=0.0.0.0 --port=5000

volumes:
  cyberquest_dev_data:
